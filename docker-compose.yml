version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: stockmate-mysql
    restart: always
    environment:
      MYSQL_DATABASE: stockmate
      MYSQL_USER: stockuser
      MYSQL_PASSWORD: stockpass
      MYSQL_ROOT_PASSWORD: rootsecretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "stockuser", "-pstockpass"]
      timeout: 10s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: stockmate-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=stockmate
      - DB_USER=stockuser
      - DB_PASSWORD=stockpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
